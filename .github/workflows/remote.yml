name: Remote

on:
  workflow_dispatch:

jobs:
  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        env:
          REMOTE_WRITE_URL: ${{ secrets.PROMETHEUS_REMOTE_WRITE_URL }}
          REMOTE_WRITE_USERNAME: ${{ secrets.PROMETHEUS_REMOTE_WRITE_USERNAME }}
          REMOTE_WRITE_PASSWORD: ${{ secrets.PROMETHEUS_REMOTE_WRITE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${REMOTE_WRITE_URL:-}" ]; then
            echo "PROMETHEUS_REMOTE_WRITE_URL is not set" >&2
            exit 1
          fi
          case "$REMOTE_WRITE_URL" in
            https://*) ;;
            *) echo "endpoint must use https" >&2; exit 1 ;;
          esac
          if [ -z "${REMOTE_WRITE_USERNAME:-}" ] || [ -z "${REMOTE_WRITE_PASSWORD:-}" ]; then
            echo "PROMETHEUS_REMOTE_WRITE_USERNAME or PROMETHEUS_REMOTE_WRITE_PASSWORD is not set" >&2
            exit 1
          fi

      - uses: ./.github/actions/runner-metrics-start
        with:
          remote-write-url: ${{ secrets.PROMETHEUS_REMOTE_WRITE_URL }}
          username: ${{ secrets.PROMETHEUS_REMOTE_WRITE_USERNAME }}
          password: ${{ secrets.PROMETHEUS_REMOTE_WRITE_PASSWORD }}

      - uses: ./.github/actions/runner-metrics-mark
        with:
          step: burn-cpu

      - name: Burn cpu
        run: |
          for i in $(seq 1 "$(nproc)"); do (timeout 45 bash -c 'while :; do :; done') & done
          wait

      - uses: ./.github/actions/runner-metrics-mark
        with:
          step: burn-disk

      - name: Burn disk
        run: |
          dd if=/dev/zero of="$RUNNER_TEMP/blob" bs=1M count=2048 conv=fdatasync status=none
          rm -f "$RUNNER_TEMP/blob"

      - name: Verify delivery
        run: |
          set -euo pipefail
          sleep 20
          stats="$(curl -fsS http://127.0.0.1:9099/metrics)"
          echo "$stats" | grep -E '^prometheus_remote_storage_samples' || true
          sum() { echo "$stats" | awk -v pattern="^$1" '$0 ~ pattern { s += $NF } END { printf "%.0f", s + 0 }'; }
          sent="$(sum 'prometheus_remote_storage_samples_total')"
          failed="$(sum 'prometheus_remote_storage_samples_failed_total')"
          pending="$(sum 'prometheus_remote_storage_samples_pending')"
          delivered=$(( sent - failed ))
          echo "delivered=$delivered failed=$failed pending=$pending"
          {
            echo "## Remote write verification"
            echo
            echo '```'
            echo "delivered: $delivered"
            echo "failed:    $failed"
            echo "pending:   $pending"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" -ne 0 ]; then
            echo "endpoint rejected $failed samples" >&2
            tail -n 40 "$RUNNER_METRICS_ROOT/prometheus.log" >&2 || true
            exit 1
          fi
          if [ "$delivered" -le 0 ]; then
            echo "no samples reached the endpoint" >&2
            tail -n 40 "$RUNNER_METRICS_ROOT/prometheus.log" >&2 || true
            exit 1
          fi

      - uses: ./.github/actions/runner-metrics-stop
        if: always()

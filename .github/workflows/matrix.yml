name: Matrix

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - ubuntu-slim
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/runner-metrics-start

      - uses: ./.github/actions/runner-metrics-mark
        with:
          step: load

      - name: Load
        run: |
          for _ in $(seq 1 "$(nproc)"); do (timeout 30 bash -c 'while :; do :; done') & done
          wait

      - uses: ./.github/actions/runner-metrics-stop
        if: always()

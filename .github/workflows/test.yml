name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - name: Install linters
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          if ! command -v shellcheck > /dev/null; then
            curl -fsSL --retry 3 https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.$(uname -m).tar.xz \
              | tar -xJ -C "$RUNNER_TEMP/tools" --strip-components=1 "shellcheck-v0.10.0/shellcheck"
          fi
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet yamllint
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Shellcheck
        run: shellcheck -x --shell=bash scripts/*.sh tests/stubs/*

      - name: Actionlint
        run: |
          set -euo pipefail
          bash <(curl -fsSL --retry 3 https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - name: Yamllint
        run: yamllint -c .yamllint .github tests .yamllint

  unit:
    strategy:
      fail-fast: false
      matrix:
        awk: [mawk, gawk]
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: git clone --quiet --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core "$RUNNER_TEMP/bats"

      - name: Run unit tests
        run: |
          set -euo pipefail
          if ! command -v "${{ matrix.awk }}" > /dev/null; then
            echo "::notice::${{ matrix.awk }} is not installed on this runner"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/awk"
          ln -sf "$(command -v "${{ matrix.awk }}")" "$RUNNER_TEMP/awk/awk"
          PATH="$RUNNER_TEMP/awk:$PATH" awk --version 2>&1 | head -n 1
          PATH="$RUNNER_TEMP/awk:$PATH" "$RUNNER_TEMP/bats/bin/bats" --print-output-on-failure --timing tests/unit

  integration:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - name: Install bats
        run: git clone --quiet --depth 1 --branch v1.11.1 https://github.com/bats-core/bats-core "$RUNNER_TEMP/bats"

      - name: Run integration tests
        run: |
          "$RUNNER_TEMP/bats/bin/bats" --print-output-on-failure --timing tests/integration

  e2e:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - name: Start a remote write receiver
        run: |
          set -euo pipefail
          nohup python3 tests/integration/receiver.py --port 19301 --user metrics \
            --password 's3cr3t pass"word' --status 204 --state "$RUNNER_TEMP/receiver.json" \
            > "$RUNNER_TEMP/receiver.log" 2>&1 &
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:19301/; then exit 0; fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/receiver.log"
          exit 1

      - uses: ./.github/actions/runner-metrics-start
        with:
          remote-write-url: http://127.0.0.1:19301/api/v1/write
          username: metrics
          password: 's3cr3t pass"word'
          scrape-interval: 2s

      - name: The collectors are up and labelled
        run: |
          set -euo pipefail
          test -n "$RUNNER_METRICS_ROOT"
          test "$RUNNER_METRICS_REMOTE_WRITE" = enabled
          curl -fsS -o /dev/null http://127.0.0.1:9100/metrics
          curl -fsS -o /dev/null http://127.0.0.1:9099/metrics
          grep -q "gha_job_name: " "$RUNNER_METRICS_ROOT/agent.yml"
          test -s "$RUNNER_METRICS_ROOT/password"

      - uses: ./.github/actions/runner-metrics-mark
        with:
          step: burn cpu

      - name: Burn cpu
        run: |
          for _ in $(seq 1 "$(nproc)"); do (timeout 20 bash -c 'while :; do :; done') & done
          wait

      - name: The active step is exposed
        run: curl -fsS http://127.0.0.1:9100/metrics | grep -q 'gha_step_active{step="burn cpu"} 1'

      - uses: ./.github/actions/runner-metrics-stop
        with:
          drain-seconds: "3"
          cleanup: "false"

      - name: The endpoint received authenticated samples
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/receiver.json" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1]))
          print(state)
          assert state["accepted"] > 0, "the endpoint never received an accepted write"
          assert state["rejected"] == 0, "the endpoint rejected the credentials"
          assert state["snappy"] == state["accepted"], "a write was not snappy encoded"
          assert state["paths"] == ["/api/v1/write"], state["paths"]
          PY

      - name: The report describes the run
        run: |
          set -euo pipefail
          report="$RUNNER_METRICS_ROOT/report.md"
          cat "$report"
          grep -q '^## Runner metrics report$' "$report"
          grep -q '^remote write: enabled$' "$report"
          grep -qE '^\| CPU cores \| [1-9][0-9]* \|$' "$report"
          grep -qE '^\| Memory total \| [0-9]+\.[0-9]{2} GiB \|$' "$report"
          grep -qE '^\| Free space on / \| [0-9]+\.[0-9]{2} GiB \|$' "$report"
          grep -q 'prometheus_remote_storage_samples' "$report"
          grep -q '^### prometheus log$' "$report"

      - name: The secrets are gone and the collectors are stopped
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_METRICS_ROOT/password"
          test ! -e "$RUNNER_METRICS_ROOT/curlrc"
          test ! -e "$RUNNER_METRICS_ROOT/agent.yml"
          if curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:9099/metrics; then exit 1; fi
          if curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:9100/metrics; then exit 1; fi

  e2e-local-only:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/runner-metrics-start

      - name: Prometheus was not downloaded
        run: |
          set -euo pipefail
          test "$RUNNER_METRICS_REMOTE_WRITE" = disabled
          test ! -e "$RUNNER_METRICS_ROOT/bin/prometheus"
          curl -fsS -o /dev/null http://127.0.0.1:9100/metrics

      - uses: ./.github/actions/runner-metrics-mark
        with:
          step: idle

      - name: Idle
        run: sleep 5

      - uses: ./.github/actions/runner-metrics-stop
        with:
          drain-seconds: "1"
          cleanup: "false"

      - name: The report says the collection was local
        run: |
          set -euo pipefail
          grep -q '^remote write: disabled$' "$RUNNER_METRICS_ROOT/report.md"
          if grep -q 'Remote storage' "$RUNNER_METRICS_ROOT/report.md"; then exit 1; fi
          test ! -e "$RUNNER_METRICS_ROOT/bin/prometheus"

  e2e-hostile-inputs:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/runner-metrics-start
        with:
          remote-write-url: "  "
          job-name: "matrix (o'brien)"

      - uses: ./.github/actions/runner-metrics-mark
        with:
          step: 'step "with" quotes'

      - name: The marker survived the quotes
        run: curl -fsS http://127.0.0.1:9100/metrics | grep -q 'gha_step_active{step="step \\"with\\" quotes"} 1'

      - uses: ./.github/actions/runner-metrics-stop
        with:
          drain-seconds: "0"
          flush-timeout: "not a number"
          cleanup: "false"

      - name: A garbage timeout still stopped everything cleanly
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_METRICS_ROOT/password"
          grep -q '^## Runner metrics report$' "$RUNNER_METRICS_ROOT/report.md"

  e2e-stop-without-start:
    runs-on: pool
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/runner-metrics-mark
        with:
          step: never marked

      - uses: ./.github/actions/runner-metrics-stop

      - name: Nothing was collected and nothing failed
        run: test -z "${RUNNER_METRICS_ROOT:-}"

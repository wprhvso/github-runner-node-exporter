name: Runner metrics mark
description: Marks the currently running workflow step in runner metrics

inputs:
  step:
    description: Step name
    required: true

runs:
  using: composite
  steps:
    - name: Write step marker
      shell: bash
      env:
        RUNNER_METRICS_STEP: ${{ inputs.step }}
      run: |
        set -euo pipefail
        if [ -z "${RUNNER_METRICS_TEXTFILE_DIR:-}" ]; then exit 0; fi
        dir="$RUNNER_METRICS_TEXTFILE_DIR"
        printf '# HELP gha_step_active Currently running workflow step.\n# TYPE gha_step_active gauge\ngha_step_active{step="%s"} 1\n' "$RUNNER_METRICS_STEP" > "$dir/step.prom.tmp"
        mv "$dir/step.prom.tmp" "$dir/step.prom"
